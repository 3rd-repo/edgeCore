# Dependabot 依赖扫描（SCA）
# 覆盖 Go 模块、GitHub Actions、前端 npm 依赖
version: 2

updates:
  # Go 后端依赖
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    groups:
      # 次要/补丁版本合并为一个 PR，减少 PR 噪音
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions 版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

  # 前端 UI 依赖（Vue + Element Plus）
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
