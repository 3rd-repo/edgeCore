name: CI

on:
  pull_request:
    branches:
      - dev
      - main
      - master
  push:
    branches:
      - dev
      - main
      - master

jobs:
  # ---------- Lint 强制门禁（golangci-lint，使用仓库根目录 .golangci.yml）----------
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # 固定 v1.64 系列：仓库 .golangci.yml 为 v1 配置格式，
          # action v7 仅支持 golangci-lint v2；升级到 v2 需先迁移配置
          version: v1.64.8
          args: --build-tags sim --timeout 5m

  gates:
    name: Short tests and build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - name: Install dependencies
        run: go mod download

      - name: Run short unit tests
        env:
          CGO_ENABLED: '0'
        run: make test-short

      - name: Run short soak gate
        env:
          CGO_ENABLED: '0'
        run: make test-soak-short

      - name: Build smoke (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/main.go

  bench-q3:
    name: Q3 10k benchmark gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - name: Install dependencies
        run: go mod download

      - name: Run Q3 benchmark gate
        env:
          CGO_ENABLED: '0'
        run: make bench-q3
